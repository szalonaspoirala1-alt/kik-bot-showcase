<script>
    document.querySelectorAll('.faq-question').forEach(question => {
      question.addEventListener('click', () => {
        const item = question.parentNode;
        item.classList.toggle('active');
      });
    });

    function copyCommand(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    }

    const BASE_API = "https://kik-bot-production-4a45.up.railway.app";

    async function fetchBotStats() {
      const statusText = document.querySelector('.bot-status span:last-child');
      const statusDot = document.querySelector('.status-dot');

      try {
        const response = await fetch(`${BASE_API}/api/stats`);
        if (!response.ok) throw new Error("Błąd HTTP: " + response.status);
        const data = await response.json();

        document.getElementById('stat-shots').innerText = data.shots || 0;
        document.getElementById('stat-screens').innerText = data.screens || 0;
        document.getElementById('stat-gifs').innerText = data.gifs || 0;
        document.getElementById('stat-compilations').innerText = data.compilations || 0;

        if (statusText && statusDot) {
          statusText.innerText = "Bot Online • API Railway";
          statusDot.style.backgroundColor = "var(--green)";
          statusDot.style.boxShadow = "0 0 8px var(--green)";
        }
      } catch (error) {
        console.error("Błąd pobierania danych:", error);
        if (statusText && statusDot) {
          statusText.innerText = "Bot Offline • Łączenie...";
          statusDot.style.backgroundColor = "#ff4444";
          statusDot.style.boxShadow = "0 0 8px #ff4444";
        }
      }
    }

    async function fetchLeaderboard() {
      const container = document.getElementById('leaderboard-body');
      if (!container) return;

      try {
        const response = await fetch(`${BASE_API}/api/top`);
        if (!response.ok) throw new Error("Błąd HTTP: " + response.status);
        const list = await response.json();

        if (!list || list.length === 0) {
          container.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--muted);">Brak zarejestrowanej aktywności twórców.</div>`;
          return;
        }

        const medals = ["🥇", "🥈", "🥉"];
        let html = "";

        list.forEach(item => {
          const rankIcon = item.rank <= 3 ? medals[item.rank - 1] : `#${item.rank}`;
          html += `
            <div class="leaderboard-row">
              <div class="rank-cell">${rankIcon}</div>
              <div class="user-cell">
                <img class="user-avatar" src="${item.avatar}" alt="${item.name}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <span class="user-name">${item.name}</span>
              </div>
              <div class="stats-breakdown">
                🎬 ${item.shots} | 📸 ${item.screens} | 🎞️ ${item.gifs}
              </div>
              <div class="score-cell">${item.score} pkt</div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (e) {
        console.error("Błąd ładowania rankingu:", e);
      }
    }

    fetchBotStats();
    fetchLeaderboard();
    setInterval(fetchBotStats, 30000);
    setInterval(fetchLeaderboard, 45000);
  </script>
